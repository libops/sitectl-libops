name: goreleaser

on:
  workflow_dispatch:
    inputs:
      release-mode:
        description: Full release or recovery mode; full recovery requires an existing empty release
        required: true
        type: choice
        default: packages-only
        options:
          - packages-only
          - full
      release-version:
        description: Exact existing vMAJOR.MINOR.PATCH tag for recovery
        required: false
        type: string
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.release-version || github.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          install-only: true

      - name: lint
        run: make lint

      - name: unit test
        run: make test

      - name: First-customer site and Task Agent integration
        run: make integration-test

  goreleaser:
    needs: lint-test
    uses: libops/.github/.github/workflows/sitectl-plugin-goreleaser.yaml@aed757251444f4318c70cfa8f3f461b3e9d1d13b # main
    permissions:
      contents: write
      id-token: write
    secrets:
      HOMEBREW_REPO: ${{ secrets.HOMEBREW_REPO }}
    with:
      go-version: "1.26.5"
      release-mode: ${{ github.ref_type == 'tag' && 'full' || inputs.release-mode }}
      release-version: ${{ inputs.release-version }}
      package-name: sitectl-libops
      sitectl-ref: e0c99fb76bba65049865b4270bc0bcbabab9c3ed # v1.9.0
